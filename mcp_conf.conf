# Native Windows example. Adapt all paths for another clone/worktree or host.
# Install this project's package in the selected Python environment first.
[mcp_servers.uppaal]
command = "D:/uppaal_mcp/.venv/Scripts/python.exe"
args = ["-m", "uppaal_mcp"]
cwd = "D:/uppaal_mcp"
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.uppaal.env]
UPPAAL_VERIFYTA_PATH = "D:/UPPAAL/app/bin/verifyta.exe"
UPPAAL_MCP_WORKSPACE = "D:/uppaal_mcp/.uppaal_mcp_workspace"
UPPAAL_TIMEOUT_SEC = "60"
