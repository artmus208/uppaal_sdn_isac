name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - read
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests and coordination checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate coordination artifacts
        run: python scripts/check_coordination.py

      - name: Install project
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Licensed UPPAAL model checking is intentionally excluded. This workflow
      # checks Python behavior and coordination contracts, not scientific claims.
